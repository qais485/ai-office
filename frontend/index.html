    <!-- Structured Data: FAQPage (public-facing) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is AI Virtual Office?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AI Virtual Office is a self-hosted platform where you hire AI agents into virtual office rooms, connect them to Telegram, Discord, and email, and let them handle customer support, file management, and knowledge-based tasks around the clock."
          }
        },
        {
          "@type": "Question",
          "name": "Which channels does AI Virtual Office support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AI Virtual Office supports Telegram (Bot API and personal account), Discord (Bot), Gmail (REST + Pub/Sub push), IMAP/SMTP email, Google Drive, and Google Calendar. More integrations are being added."
          }
        },
        {
          "@type": "Question",
          "name": "Is AI Virtual Office self-hosted?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. AI Virtual Office is fully self-hosted using Docker. Your data stays on your own infrastructure — the platform connects to your LLM provider and channels but never stores data on external servers."
          }
        },
        {
          "@type": "Question",
          "name": "How do AI agents use my company knowledge?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You upload text sources (FAQs, documentation, pricing) to the built-in knowledge base. The platform uses pgvector-backed semantic search (RAG) to retrieve relevant excerpts, which are injected into every agent decision so replies are grounded in your actual content."
          }
        }
      ]
    }
